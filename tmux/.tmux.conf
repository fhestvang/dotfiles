# tmux configuration

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm*:Tc:smcup@:rmcup@"
set -ag terminal-overrides ",*256col*:Tc"
set -g extended-keys on
run-shell -b 'tmux set-option -g extended-keys-format csi-u 2>/dev/null || true'

set -g history-limit 50000
set -g mouse on
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles off
setw -g automatic-rename off
setw -g allow-rename off
set -g detach-on-destroy off
set -sg escape-time 0

unbind-key -q C-b
set -g prefix M-a
bind-key M-a send-prefix

set -g allow-passthrough on
set -g set-clipboard on
set -g update-environment "DISPLAY WAYLAND_DISPLAY XAUTHORITY DBUS_SESSION_BUS_ADDRESS XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_RUNTIME_DIR PULSE_SERVER SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION SSH_TTY WINDOWID KRB5CCNAME"

set -g status-position bottom
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
run-shell -b 'host="$(if [ -x "$HOME/github/dotfiles/bin/prompt-host" ]; then "$HOME/github/dotfiles/bin/prompt-host"; else hostname -s 2>/dev/null || printf local; fi)"; tmux set-option -gq @fhh_host_label "$host"'
set -g status-left "#{prefix_highlight}#[fg=#9ece6a,bold] #{@fhh_host_label} #[fg=#565f89]|#[fg=#7aa2f7,bold] #S:#I.#P "
set -g status-right "#[fg=#9ece6a]#{=/48/...:pane_current_path} #[fg=#565f89]| CPU:#{cpu_percentage} RAM:#{ram_percentage} | %H:%M "
set -g status-justify left
set -g status-left-length 80
set -g status-right-length 96
set -g @prefix_highlight_prefix_prompt 'NORMAL'
set -g @prefix_highlight_empty_prompt 'INSERT'
set -g @prefix_highlight_empty_has_affixes 'on'
set -g bell-action none
set -g visual-bell off
setw -g monitor-bell off
setw -g window-status-bell-style "fg=#e0af68,bold"
setw -g window-status-format "#[fg=#565f89] #I:#W#{?#{==:#{@codex_agent_state},working},#[fg=#9ece6a] *,#{?#{==:#{@codex_agent_state},done},#[fg=#e0af68] !,#{?window_bell_flag,#[fg=#e0af68] !,}}}#[fg=#565f89] "
setw -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W#{?#{==:#{@codex_agent_state},working},#[fg=#9ece6a] *,#{?#{==:#{@codex_agent_state},done},#[fg=#e0af68] !,#{?window_bell_flag,#[fg=#e0af68] !,}}}#[fg=#7aa2f7,bold] "

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7,bold"
set -g pane-border-status top
set -g pane-border-format " #[fg=#9ece6a,bold]#{b:pane_current_path}: #{?#{@pane_label},#{@pane_label},#{window_name}} "
set -g window-style "fg=#4e5579,bg=#111118"
set -g window-active-style "fg=#c8d3f5,bg=#1e1f2b"

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @fzf-url-bind 'u'
set -g @fzf-url-history-limit '2000'
set -g @fzf-url-open '/home/fhestvang/github/dotfiles/bin/open-on-laptop'

setw -g mode-keys vi
bind C-u copy-mode \; send-keys -X search-backward "^› "
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "$HOME/github/dotfiles/bin/clipboard-copy"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind , command-prompt -p "Tab name: " "set-window-option automatic-rename off; rename-window '%%'"
bind T command-prompt -p "Pane title: " "set-option -pq @pane_label '%%'"
set-hook -g pane-focus-in 'run-shell -b "[ -x \"$HOME/bin/tmux-agent-state\" ] && \"$HOME/bin/tmux-agent-state\" seen #{q:pane_id} || { [ -x \"$HOME/github/dotfiles/bin/tmux-agent-state\" ] && \"$HOME/github/dotfiles/bin/tmux-agent-state\" seen #{q:pane_id} || true; }"'
set-hook -g after-select-pane 'run-shell -b "[ -x \"$HOME/bin/tmux-agent-state\" ] && \"$HOME/bin/tmux-agent-state\" seen #{q:pane_id} || { [ -x \"$HOME/github/dotfiles/bin/tmux-agent-state\" ] && \"$HOME/github/dotfiles/bin/tmux-agent-state\" seen #{q:pane_id} || true; }"'
set-hook -g session-window-changed 'run-shell -b "[ -x \"$HOME/bin/tmux-agent-state\" ] && \"$HOME/bin/tmux-agent-state\" seen #{q:pane_id} || { [ -x \"$HOME/github/dotfiles/bin/tmux-agent-state\" ] && \"$HOME/github/dotfiles/bin/tmux-agent-state\" seen #{q:pane_id} || true; }"'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind n next-window
bind p previous-window

bind -n C-Left resize-pane -L 2
bind -n C-Right resize-pane -R 2
bind -n C-Up resize-pane -U 2
bind -n C-Down resize-pane -D 2

bind g display-popup -E -w 100% -h 100% -d "#{pane_current_path}" "git diff --color=always | delta --paging=always --line-numbers --navigate"

bind z display-popup -E -w 85% -h 75% -d "#{pane_current_path}" -T "zoxide" "$HOME/github/dotfiles/bin/tmux-zoxide-popup --window"
bind Z display-popup -E -w 85% -h 75% -d "#{pane_current_path}" -T "zoxide shell" "$HOME/github/dotfiles/bin/tmux-zoxide-popup --shell"
bind M display-popup -E -w 90% -h 90% -d "#{pane_current_path}" -T "markdown" "find . -type f -iname '*.md' -o -type f -iname '*.markdown' 2>/dev/null | fzf --preview 'glow --style dark {}' --preview-window=right:60%:wrap --bind 'enter:become(glow --pager {})'"
bind -n M-m display-popup -E -w 92% -h 82% -d "#{pane_current_path}" -T "markdown preview" "$HOME/github/dotfiles/bin/tmux-markdown-preview"
bind P display-popup -E -w 92% -h 82% -d "#{pane_current_path}" -T "command palette" "TMUX_PALETTE_PANE=#{pane_id} TMUX_PALETTE_WINDOW=#{window_id} exec $HOME/github/dotfiles/bin/tmux-command-palette"
bind -n M-p display-popup -E -w 92% -h 82% -d "#{pane_current_path}" -T "command palette" "TMUX_PALETTE_PANE=#{pane_id} TMUX_PALETTE_WINDOW=#{window_id} exec $HOME/github/dotfiles/bin/tmux-command-palette"
bind -n M-u run-shell -b "$HOME/github/dotfiles/bin/tmux-fzf-url 2000 $HOME/github/dotfiles/bin/open-on-laptop '' '' ''"
bind-key -T root C-MouseDown1Pane select-pane -t = \; run-shell -b "$HOME/github/dotfiles/bin/tmux-open-mouse-url #{q:mouse_hyperlink} #{q:mouse_word} #{q:mouse_line}"

bind S if-shell 'command -v sesh >/dev/null 2>&1' 'display-popup -E -w 80% -h 70% -d "#{pane_current_path}" -T "sesh" "sesh picker --icons --hide-duplicates --separator-aware"' 'display-message "sesh not found"'
bind L if-shell 'command -v sesh >/dev/null 2>&1' 'run-shell "sesh last"' 'switch-client -l'
bind 9 if-shell 'command -v sesh >/dev/null 2>&1' 'run-shell "sesh connect --root #{q:pane_current_path}"' 'display-message "sesh not found"'

bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down
bind-key -T copy-mode WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X scroll-down
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "$HOME/github/dotfiles/bin/clipboard-copy"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "$HOME/github/dotfiles/bin/clipboard-copy"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'NHDaly/tmux-better-mouse-mode'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'wfxr/tmux-fzf-url'

if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' 'run "$HOME/.tmux/plugins/tpm/tpm"'

# Match the laptop/default tmux wheel behavior, including better-mouse style
# forwarding and 3-line copy-mode scroll steps.
bind-key -T root WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "         if -Ft= ''           \"send-keys -t= up ; send-keys -t= up ; send-keys -t= up ; \"           \"             select-pane -t= ;             if -Ft= '#{pane_in_mode}'               'send-keys -M ; send-keys -M ; send-keys -M ; '               'copy-mode -e ; send-keys -M ; send-keys -M ; send-keys -M ; '           \"       "
bind-key -T root WheelDownPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "         if -Ft= \"\"           \"send-keys -t= down ; send-keys -t= down ; send-keys -t= down ; \"           \"select-pane -t= ; send-keys -M ; send-keys -M ; send-keys -M ; \"       "
bind-key -T copy-mode-vi WheelUpPane send-keys -X -N 3 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down
bind-key -T copy-mode WheelUpPane send-keys -X -N 3 scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X -N 3 scroll-down
